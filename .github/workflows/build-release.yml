name: Build and Release

on:
  push:
    # Every branch, but not tags.
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      version: ${{ steps.mod.outputs.version }}
      tag: ${{ steps.mod.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod
        run: ./gradlew build

      - name: Read mod version
        id: mod
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties)"
          short_sha="${GITHUB_SHA::7}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}-${short_sha}" >> "$GITHUB_OUTPUT"

      - name: Upload built jars
        uses: actions/upload-artifact@v7
        with:
          name: mcchatapi-jars
          path: build/libs/mcchatapi-*.jar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v8
        with:
          name: mcchatapi-jars
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run on the same commit: replace the assets instead of failing.
            gh release upload "$TAG" dist/*.jar --clobber
          else
            gh release create "$TAG" dist/*.jar \
              --target "$GITHUB_SHA" \
              --title "MC Chat API v$VERSION (${GITHUB_SHA::7})" \
              --generate-notes
          fi
