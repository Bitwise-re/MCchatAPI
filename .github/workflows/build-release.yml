name: Build and Release

on:
  push:
    # Every branch, but not tags.
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    outputs:
      release_name: ${{ steps.mod.outputs.release_name }}
      tag: ${{ steps.mod.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod
        run: ./gradlew build

      - name: Determine release name
        id: mod
        run: |
          mapfile -t jars < <(
            find build/libs -maxdepth 1 -type f -name 'mcchatapi-*.jar' \
              ! -name '*-sources.jar' ! -name '*-dev.jar' | sort
          )
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "Expected exactly one main mod jar in build/libs, found ${#jars[@]}" >&2
            printf '  %s\n' "${jars[@]}" >&2
            exit 1
          fi
          release_name="$(basename "${jars[0]}" .jar)"
          echo "release_name=$release_name" >> "$GITHUB_OUTPUT"
          echo "tag=$release_name" >> "$GITHUB_OUTPUT"

      - name: Upload built jars
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.mod.outputs.release_name }}
          path: build/libs/mcchatapi-*.jar
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    concurrency:
      group: release-main
      cancel-in-progress: false
    steps:
      - name: Download built jars
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.release_name }}
          path: dist

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.build.outputs.tag }}
          RELEASE_NAME: ${{ needs.build.outputs.release_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same jar version on another commit or a re-run: replace the assets.
            gh release upload "$TAG" dist/*.jar --clobber
          else
            gh release create "$TAG" dist/*.jar \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --generate-notes
          fi
